org: mawaqit
app: alexa
service: mawaqit-alexa-azan

frameworkVersion: ^4.0.0

# Bundle each function with esbuild (Serverless v4 native) instead of zipping
# node_modules.
build:
  esbuild:
    bundle: true
    # keep it readable, not minified: CloudWatch stack traces then point at real
    # function names/lines, and the zip is already tiny
    minify: false
    # sourcemap off to avoid shipping multi-MB .map files.
    sourcemap: false

# Tests live next to the code they cover, but must never ship in the Lambda zip.
package:
  patterns:
    - "!tests/**"
    - "!**/*.test.js"

custom:
  defaultStage: dev
  defaultRegion: eu-west-1 # Compute is always in Ireland
  dynamoRegion: eu-west-3 # Data is always in Paris
  ssmRegion: eu-west-3

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, self:custom.defaultStage}
  region: ${opt:region, self:custom.defaultRegion}

  # Load env vars dynamically based on stage
  environment: ${file(env.json):${self:provider.stage}}
  # deploymentBucket:
  #   name: mawaqit-serverless-deploy-${self:custom.defaultRegion}-${self:provider.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${self:custom.dynamoRegion}:${aws:accountId}:table/*
        - Effect: Allow
          Action:
            - "ssm:GetParameter"
            - "ssm:GetParameters"
          Resource:
            - arn:aws:ssm:${self:custom.ssmRegion}:${aws:accountId}:parameter/alexa/*

functions:
  # ----------------------------------------
  # THE TRIGGER LAMBDA (Dispatcher)
  # ----------------------------------------
  dispatcherHandler:
    handler: src/handlers/dispatcher.handler
    name: mawaqit-azan-${self:provider.stage}-handler
    timeout: 10
    # Loads events from eventsources.yml -> dispatcher -> [stage]
    events: ${file(eventsources.yml):${self:provider.stage}, file(eventsources.yml):dev}
