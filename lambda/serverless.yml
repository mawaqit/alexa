org: mawaqit
app: alexa
service: alexa

frameworkVersion: ^4.0.0

# Bundle each function with esbuild (Serverless v4 native) instead of zipping
# node_modules.
build:
  esbuild:
    bundle: true
    # keep it readable, not minified: CloudWatch stack traces then point at real
    # function names/lines, and the zip is already tiny
    minify: false
    # sourcemap off to avoid shipping multi-MB .map files.
    sourcemap: false

# Tests live next to the code they cover, but must never ship in the Lambda zip.
package:
  patterns:
    - "!tests/**"
    - "!**/*.test.js"

custom:
  defaultStage: dev
  defaultRegion: eu-west-3
  alias: ${self:provider.stage}

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, self:custom.defaultStage}
  region: ${opt:region, self:custom.defaultRegion}
  environment:
    SCHEDULER_ROLE_ARN: arn:aws:iam::${aws:accountId}:role/${self:service}-${self:provider.stage}-${self:provider.region}-lambdaRole
    MAWAQIT_ALEXA_SKILL_ID: ${file(env.json):${self:provider.stage}.mawaqitAlexaSkillId}
    STAGE: ${self:provider.stage}
    AWS_ACCOUNT_ID: ${aws:accountId}
    BASE_URL: ${file(env.json):${self:provider.stage}.baseUrl}
    PERSISTENCE_ADAPTER_TABLE_NAME: mawaqit-alexa-user-data-${self:provider.stage}
    SKILL_NAME: MAWAQIT
    AWS_LAMBDA_NODEJS_DISABLE_CALLBACK_WARNING: ${file(env.json):${self:provider.stage}.AWS_LAMBDA_NODEJS_DISABLE_CALLBACK_WARNING}
    AZAN_DYNAMO_DB_TABLE: mawaqit-alexa-azan-users-data-${self:provider.stage}
    UPDATE_INTERVAL_HADITH_WIDGET_IN_HOURS: ${file(env.json):${self:provider.stage}.updateIntervalHadithWidgetInHours}
    SQS_QUEUE_BATCH_SIZE: ${file(env.json):${self:provider.stage}.sqsQueueBatchSize, '10'}
    SQS_QUEUE_URL: { Ref: AlexaAzanQueue }
    MOSQUE_AZAN_DATA_TABLE: mawaqit-alexa-mosque-azan-data-${self:provider.stage}
    WEB_ORIGIN: ${file(env.json):${self:provider.stage}.webOrigin, 'http://localhost:5173'}
    WEB_REDIRECT_URI: ${file(env.json):${self:provider.stage}.webRedirectUri, 'http://localhost:3000/auth/callback'}
    # Stand-in until /alexa/webClientId etc. exist in SSM (pending platform
    # team access) — same variable names awsSsmHandler.js writes, so once
    # those SSM params exist it silently overwrites these and env.json's
    # copies become dead weight to delete, no code change needed either way.
    webClientId: ${file(env.json):${self:provider.stage}.webClientId, ''}
    webClientSecret: ${file(env.json):${self:provider.stage}.webClientSecret, ''}
    webSessionSecret: ${file(env.json):${self:provider.stage}.webSessionSecret, ''}
  lambdaHashingVersion: 20201221

  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource: "*"
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "*"
    - Effect: Allow
      Action:
        - "ssm:GetParameter"
        - "ssm:GetParameters"
      Resource: "*"
    - Effect: Allow
      Action:
        - "kms:Decrypt"
      Resource: "*"
    - Effect: Allow
      Action:
        - scheduler:*
      Resource: "arn:aws:scheduler:${self:provider.region}:${aws:accountId}:schedule/*"
    - Effect: Allow
      Action:
        - sqs:*
      Resource: "arn:aws:sqs:${self:provider.region}:${aws:accountId}:mawaqit-alexa-azan-queue-${self:provider.stage}"
    - Effect: Allow
      Action:
        - iam:PassRole
      Resource: arn:aws:iam::${aws:accountId}:role/${self:service}-${self:provider.stage}-${self:provider.region}-lambdaRole

functions:
  indexHandler:
    handler: index.handler
    timeout: 9
    memorySize: 128
    description: MAWAQIT Alexa Backend - ${self:provider.stage}
    events: ${file(eventsources.yml):${self:provider.stage}, file(eventsources.yml):dev}
    versionFunction: false

  triggerHandler:
    handler: trigger.handler
    timeout: 900
    memorySize: 128
    description: Lambda will be triggered by EventBridge to send event to Worker Lambda
    versionFunction: false

  workerHandler:
    handler: worker.handler
    timeout: 900
    memorySize: 128
    description: Worker Lambda to process Alexa events from SQS
    versionFunction: false

  webApiHandler:
    handler: webApi.handler
    timeout: 10
    memorySize: 128
    description: HTTP API for the MAWAQIT companion website (LWA login, mosque/prayer config)
    # Lambda Function URL, not API Gateway: webApi.js already does its own
    # internal routing (one function, no fan-out to other functions), so
    # API Gateway's main value-add wasn't being used — this is simpler
    # infrastructure for the same event/response shape (Function URL events
    # are the same v2.0 payload format: rawPath, requestContext.http.method,
    # a cookies array, etc.), and only needs lambda:* permissions to deploy,
    # not a separate apigateway:* grant.
    url:
      cors:
        allowedOrigins:
          - ${file(env.json):${self:provider.stage}.webOrigin, 'http://localhost:5173'}
        # Authorization is required now that the session travels as a bearer
        # token, not a cookie (see webSessionHandler.js's top comment) — any
        # custom header on a cross-site fetch() forces a CORS preflight, and
        # the browser blocks the real request unless the preflight response
        # explicitly allows that header.
        allowedHeaders: [Content-Type, Authorization]
        # OPTIONS isn't a valid value here — Function URLs handle the CORS
        # preflight (OPTIONS) automatically once Cors is configured at all;
        # this list is only the actual invocation methods.
        allowedMethods: [GET, POST, PUT]
        allowCredentials: true
    versionFunction: false

resources:
  Resources:
    AlexaAzanDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: mawaqit-alexa-azan-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600 # 14 days (maximum)

    MawaqitAzanScheduleGroup:
      Type: AWS::Scheduler::ScheduleGroup
      Properties:
        Name: mawaqit-azan-schedule-${self:provider.stage}

    WorkerEventSourceMapping:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        BatchSize: ${file(env.json):${self:provider.stage}.sqsQueueBatchSize, 10}
        EventSourceArn:
          Fn::GetAtt:
            - AlexaAzanQueue
            - Arn
        FunctionName:
          Fn::GetAtt:
            - WorkerHandlerLambdaFunction
            - Arn
        FunctionResponseTypes:
          - ReportBatchItemFailures

    AlexaAzanQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: mawaqit-alexa-azan-queue-${self:provider.stage}
        VisibilityTimeout: 5400
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - AlexaAzanDLQ
              - Arn
          maxReceiveCount: 3
    AlexaAzanUsersDataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: mawaqit-alexa-azan-users-data-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    AlexaMosqueAzanDataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: mawaqit-alexa-mosque-azan-data-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    IamRoleLambdaExecution:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
                  - scheduler.amazonaws.com
              Action: sts:AssumeRole
