# Every push to main deploys the dev environment.
name: Deploy dev

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    # Caller permissions are the ceiling for reusable workflows: the deploy
    # jobs authenticate to AWS via OIDC, which needs id-token: write.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      stage: dev
      environment: dev
    secrets: inherit
