# Publishing a GitHub Release deploys the prod environment.
# The `prod` GitHub Environment should require a manual approval (see docs).
name: Deploy prod

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize prod deploys. Unlike dev we never cancel an in-flight run — a prod
# deploy must finish; concurrent releases queue behind it instead.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    # Caller permissions are the ceiling for reusable workflows: the deploy
    # jobs authenticate to AWS via OIDC, which needs id-token: write.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      stage: prod
      environment: prod
    secrets: inherit
