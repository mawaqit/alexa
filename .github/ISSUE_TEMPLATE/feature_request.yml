name: Feature request
description: Suggest something the skill should be able to do
title: "[Feature]: "
labels: ["enhancement", "type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution — knowing what you were trying
        to do often points at a simpler answer than the one you had in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do today, and what makes it awkward?
      placeholder: |
        I follow a different mosque on Fridays, and switching back and forth
        means re-selecting it every time.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like the skill to do?
      description: If it involves talking to Alexa, write the exact phrases.
      placeholder: |
        "Alexa, ask MAWAQIT to use my Friday mosque"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered instead?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the skill?
      options:
        - Prayer times
        - Smart Azan
        - Routines
        - Widgets
        - Mosque selection
        - Something else / not sure
    validations:
      required: true

  - type: checkboxes
    id: reach
    attributes:
      label: Does this involve anything users see or hear?
      description: |
        Both matter for scoping. New utterances mean editing the `en-US` and
        `fr-FR` interaction models and regenerating the rest with
        `pnpm sync:locales`; new spoken text means new prompt strings.
      options:
        - label: It needs new phrases for talking to Alexa
          required: false
        - label: It needs new text that Alexa says or displays
          required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this one
          required: true
