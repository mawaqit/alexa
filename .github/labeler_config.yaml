scope/skill-config:
  - changed-files:
      - any-glob-to-any-file:
          - "skill-package/**"
          - "ask-resources.json"

scope/ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

scope/docs:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

type/feature:
  - head-branch: ["^feat"]

type/fix:
  - head-branch: ["^fix"]

type/docs:
  - head-branch: ["^docs"]

type/refactor:
  - head-branch: ["^refactor"]

type/test:
  - head-branch: ["^test"]

type/chore:
  - head-branch: ["^chore"]

type/ci:
  - head-branch: ["^ci"]
